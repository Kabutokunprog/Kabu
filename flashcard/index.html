<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フラッシュ暗記</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="フラッシュ暗記">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f6fa; --surface:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e7ef;
  --navy:#1f3a5f; --accent:#ff7a45; --accent-soft:#fff1ea; --ok:#1f9d63; --ok-soft:#e6f6ee;
  --ng:#e0473e; --ng-soft:#fdecea; --chip:#eef1f7; --shadow:0 2px 10px rgba(20,30,60,.07);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
header.top .wrap{display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
main{padding:16px 0 110px}
#updBar{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:21;background:#1f9d63;color:#fff;font-size:14px;font-weight:700;padding:9px 16px;cursor:pointer;text-align:center}
#jobBar{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:19;background:var(--accent-soft);border-bottom:1px solid #ffd9c7}
#jobBar button{width:100%;border:0;background:none;padding:9px 0;display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;color:#a3431b;text-align:left}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .wrap{display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:6px 0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--navy);font-weight:700}
.badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--ng);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px;min-width:18px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
h2{font-size:20px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.45}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea.t{min-height:84px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:#3b4459;white-space:nowrap}
.chip.new{background:var(--accent);color:#fff;font-weight:700}
.chip.rev{background:var(--ng-soft);color:var(--ng)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.fix{background:#fff6d6;color:#8a6500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
/* トップ (学習者を選ぶ) */
.pick{display:grid;gap:14px;margin-top:10px}
.person{display:flex;align-items:center;gap:16px;background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow);padding:20px;text-align:left;width:100%}
.person .face{font-size:46px;line-height:1;width:64px;height:64px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.person .nm{font-size:22px;font-weight:800}
.person .sub{color:var(--muted);font-size:14px}
/* 教材一覧 */
.deck{display:block;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.folder{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.folder .fi{font-size:30px;line-height:1}
.subj-link{border:0;background:var(--accent-soft);color:#a3431b;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.flash-hl{box-shadow:0 0 0 3px var(--accent),var(--shadow);transition:box-shadow .3s}
.fprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fprev span{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:#3b4459;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder b{font-size:17px}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 10px}
.crumb{border:0;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--navy)}
.deck .tt{font-weight:700;font-size:17px;margin:4px 0}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
/* カード一覧 */
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.qlist .no{color:var(--muted);font-size:13px;width:26px;flex:none;text-align:right;padding-top:2px}
.qlist .q{font-size:15px}
.qlist .a{font-weight:700;color:var(--navy);font-size:15px}
.qlist .a.hide{color:transparent;background:var(--chip);border-radius:6px;user-select:none}
.qlist .ed{border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.sticky-act{position:sticky;bottom:78px;z-index:10;background:var(--navy);color:#fff;border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);margin-top:12px}
.sticky-act textarea{background:#fff;color:var(--ink);min-height:60px}
/* 出題 */
.study{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.study .head{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.flash{flex:1;display:flex;flex-direction:column;padding:6px 16px 16px;max-width:760px;width:100%;margin:0 auto;min-height:0}
.face-card{flex:1;background:var(--surface);border-radius:20px;box-shadow:0 6px 24px rgba(20,30,60,.10);padding:24px 20px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;overflow:auto;min-height:0;border:0;width:100%}
.face-card .qq{font-size:22px;font-weight:700;line-height:1.6;white-space:pre-wrap}
.face-card .qq.big{font-size:40px;letter-spacing:.06em}
.face-card .aa{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line);width:100%}
.face-card .aa .ans{font-size:28px;font-weight:800;color:var(--navy);white-space:pre-wrap}
.face-card .aa .ans.long{font-size:18px;text-align:left}
.face-card .note{margin-top:10px;color:#3b4459;font-size:15px;white-space:pre-wrap;text-align:left}
.face-card .ex{margin-top:10px;background:var(--chip);border-radius:10px;padding:10px;font-size:14px;text-align:left;white-space:pre-wrap}
.tap-hint{color:var(--muted);font-size:14px;margin-top:16px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.judge button{border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800}
.judge .ng{background:var(--ng-soft);color:var(--ng)}
.judge .ok{background:var(--ok-soft);color:var(--ok)}
.result{text-align:center;padding:20px 0}
.result .big{font-size:56px;font-weight:800;color:var(--navy)}
/* 作る */
.style-opt{display:block;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.style-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.style-opt input{display:none}
.style-opt b{display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;border-radius:10px;overflow:hidden;background:var(--chip);aspect-ratio:3/4}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .x{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:24px;padding:0}
.drop{border:2px dashed #c9d1e0;border-radius:14px;padding:18px;text-align:center;background:#fafbfe}
.order-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.order-chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px}
.steps{list-style:none;padding:0;margin:10px 0}
.steps li{padding:6px 0;color:var(--muted)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.done{color:var(--ok)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
/* モーダル */
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,20,35,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;max-width:90vw}
.center{text-align:center}
.login{max-width:420px;margin:40px auto 0}
.login .logo{font-size:56px;text-align:center}
pre.src{white-space:pre-wrap;font-size:13px;background:var(--chip);border-radius:10px;padding:10px;max-height:60vh;overflow:auto}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1 id="hTitle">⚡ フラッシュ暗記</h1>
    <button class="who hidden" id="hWho" onclick="goTop()"></button>
  </div>
</header>

<div id="updBar" class="hidden" onclick="doUpdate()">🆕 アプリの新しい版があります。ここをタップで更新（答えた分は残ります）</div>
<div id="jobBar" class="hidden"></div>
<main><div class="wrap" id="view"></div></main>

<nav class="tabs hidden" id="tabs"><div class="wrap">
  <button data-tab="decks" onclick="showTab('decks')"><span class="ic">📚</span>教材</button>
  <button data-tab="review" onclick="showTab('review')"><span class="ic">🔁</span>復習<span class="badge hidden" id="revBadge"></span></button>
  <button data-tab="history" onclick="showTab('history')"><span class="ic">📈</span>記録</button>
  <button data-tab="make" onclick="showTab('make')"><span class="ic">✨</span>作る</button>
  <button data-tab="settings" onclick="showTab('settings')"><span class="ic">⚙️</span>設定</button>
</div></nav>

<div id="studyRoot"></div>
<div id="modalRoot"></div>

<script>
'use strict';
// ------------------------------------------------------------ バージョン (変更のたびに上げる。api/flash.py の APP_VERSION と同じにする)
const APP_VERSION='1.34';
const CHANGELOG=[
  ['1.34','11/29','テスト日のカードの「まちがえ方の分析」を、全部まとめてではなくテスト科目ごと（化学・生物など）に'],
  ['1.33','11/29','教材タブのいちばん上に「📌 次のテスト」フォルダを置き、1回で開けるように。フォルダも次のテストを先頭に'],
  ['1.32','11/29','成長グラフと分析を、理科は化学・生物などテスト科目ごとに分けた。同じ科目に教材が複数あれば（地理の教科書とプリントなど）教材ごとに線の色を分けた'],
  ['1.31','11/29','テスト日を教材ごとにも分けられるように（理科の化学・生物など、同じ科目で日がちがうとき）'],
  ['1.30','11/29','テスト日を科目ごとに入れられるように。ノルマは日付の近い科目から、科目ごとの直前チェックも'],
  ['1.29','11/29','テスト日のカウントダウンと今日のノルマ、直前チェック、忘れる前の確認、まちがえ方の分析（AI）、入力して答えるモード（設定でオン）を追加'],
  ['1.28','11/29','学習の記録の科目名を押すと、その科目の成長グラフに飛ぶように'],
  ['1.27','11/29','科目ごとの成長を1つのグラフにまとめ、答え方ごとに線の色を分けた（切り替えをやめた）'],
  ['1.26','11/29','以前の記録に「4択／自分で答えた」を付けられるように。同じ日に分けて解いた分は同じ回として数える'],
  ['1.25','11/28','バージョン情報と「最近の変更」を表示'],
  ['1.24','11/28','科目ごとの成長を答え方別（自分で答える／4択／以前の記録）に分け、小さくまとめた'],
  ['1.23','11/28','成長グラフ：3問未満の点を描かない・記録の守りを追加'],
  ['1.22','11/28','記録タブに「科目ごとの成長」グラフを追加'],
  ['1.21','11/28','フラッシュカードにAI解説ボタン（もっと詳しく・作り直す）を追加'],
  ['1.20','11/23','途中から再開の保存数を1人10個に'],
  ['1.19','11/23','途中から再開の保存を軽くした'],
  ['1.18','11/23','学習・復習を途中から再開できるように'],
  ['1.17','11/23','出題順に「頻出順（テスト直前）」を追加'],
  ['1.16','11/23','使う人のアイコンを絵文字・写真から選べるように'],
  ['1.15','11/23','4択で答えるフラッシュカードを追加'],
  ['1.14','11/23','問題づくりをサーバー側で進め、アプリを閉じても止まらないように'],
];
// ------------------------------------------------------------ 定数
const GRADES = ['小5','小6','中1','中2','中3','高1','高2','高3','その他'];
const TERMS = ['1学期中間','1学期期末','2学期中間','2学期期末','3学期期末(学年末)','前期中間','前期期末','後期中間','後期期末','小テスト・その他'];
const SUBJECTS = ['歴史','地理','公民','古文','漢文','現代文・漢字','英語','理科','数学','その他'];
const STYLES = [
  ['auto','おまかせ','AIが教材を見て、いちばん合う作り方を選びます'],
  ['qa','一問一答','問題と答え(模範解答)がのっているプリント・問題集'],
  ['word','単語型','単語集・用語集（古文単語、英単語、漢字など）。表=単語、裏=意味'],
  ['predict','テスト予想','授業プリント・参考書・教科書から、テストに出そうな問題をAIが考えます'],
];
const ORDER_EXAMPLES = ['人物名を答える問題を多めに','年号も聞いて','記述問題も少し入れて','やさしめに','難しめに','答えに読みがなを付けて','穴埋めの所は全部問題にして','50問くらいで'];
const API = '/api/flash';

// ------------------------------------------------------------ 状態
const S = {
  pass: lsGet('flash_pass') || '',
  profile: null, profiles: [],
  tab: 'decks', decks: [], folder: [], deckView: 'folder',
  deck: null, cards: [], checked: new Set(), hideAns: false,
  review: [],
  make: null,
};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

// ------------------------------------------------------------ 共通
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms=2600){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
async function api(action, data={}){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Flash-Pass':S.pass},body:JSON.stringify({action,...data})});
  let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status===413) throw new Error('データが大きすぎました。写真の枚数を減らしてお試しください。');
    if(r.status===401){logout(true)}
    throw new Error(j.error||('通信エラー ('+r.status+')'));
  }
  return j;
}
// できた文字から順に受け取る (解説用)
async function streamApi(action,data,onText){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Flash-Pass':S.pass},body:JSON.stringify({action,...data})});
  if(!r.ok){let j={};try{j=await r.json()}catch(e){} if(r.status===401)logout(true); throw new Error(j.error||('通信エラー ('+r.status+')'))}
  const rd=r.body&&r.body.getReader?r.body.getReader():null, dec=new TextDecoder(); let all='';
  if(!rd){all=await r.text();onText(all);return all}
  for(;;){const {done,value}=await rd.read(); if(done)break; all+=dec.decode(value,{stream:true}); onText(all)}
  return all;
}
function opts(list, sel, blank){return (blank!=null?`<option value="">${esc(blank)}</option>`:'')+list.map(v=>`<option ${v===sel?'selected':''}>${esc(v)}</option>`).join('')}
function fmtDate(s){if(!s)return '';const d=new Date(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function daysAgo(s){return (Date.now()-new Date(s).getTime())/864e5}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setView(html){$('#view').innerHTML=html;window.scrollTo(0,0)}
function loading(msg='読み込み中…'){setView(`<p class="center muted" style="margin-top:40px"><span class="spinner"></span> ${esc(msg)}</p>`)}
function isDue(c){const d=c.progress&&c.progress.next_due_at;return !d||new Date(d)<=new Date()}

// ------------------------------------------------------------ 起動・ログイン
async function boot(){
  loading();
  let st;
  try{ st = await api('status') }catch(e){ setView(`<div class="card">${esc(e.message)}</div>`); return }
  if(!st.setup) return renderSetup();
  if(!st.ok) return renderLogin();

  loading();

// 教材一覧: 学年 → テスト(学期) → 科目 のフォルダで見る / 新しい順に全部見る
const LEVELS=[['grade','学年'],['term','テスト'],['subject','科目']];
const UNSET='未設定';
function deckCardHtml(d,newestId,showPath){
  const st=d.stats, pct=d.card_count?Math.round(st.mastered/d.card_count*100):0;
  const isNew=d.id===newestId||daysAgo(d.created_at)<3;
  return `<button class="deck" onclick="openDeck(${d.id})">
    <div class="chips">${isNew?'<span class="chip new">NEW</span>':''}
      ${showPath?`${d.grade?`<span class="chip">${esc(d.grade)}</span>`:''}${d.term?`<span class="chip">${esc(d.term)}</span>`:''}${d.subject?`<span class="chip">${esc(d.subject)}</span>`:''}`:''}
      ${st.in_review?`<span class="chip rev">復習 ${st.in_review}</span>`:''}</div>
    <div class="tt">${esc(d.title)}</div>
    <div class="muted small">${d.card_kind==='word'?'単語型':'問題型'} ・ カード ${d.card_count}枚 ・ 覚えた ${st.mastered}枚 ・ ${fmtDate(d.created_at)}${d.memo?' ・ '+esc(d.memo):''}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </button>`;
}
// フォルダの中身(下の階層のフォルダ名、いちばん下なら教材名)を開かずに見せる
function folderPreview(list){
  const lv=S.folder.length+1, key=lv<LEVELS.length?LEVELS[lv][0]:null;
  const names=key?[...new Set(list.map(d=>d[key]||UNSET))].map(n=>'📁'+n):list.map(d=>d.title);
  const shown=names.slice(0,6);
  return `<span class="fprev">${shown.map(n=>`<span>${esc(n)}</span>`).join('')}${names.length>shown.length?`<span>ほか${names.length-shown.length}</span>`:''}</span>`;
}
// 次のテストのフォルダ [学年, テスト]: テスト日が登録されていればその範囲、なければ一番新しいテスト名つきの教材から
function nextTestPath(){
  const D=S.decks||[], st=S.examStatus;
  let ds=st&&st.deck_ids&&st.deck_ids.length?D.filter(d=>st.deck_ids.includes(d.id)):[];
  if(!ds.length){const d=D.find(d=>d.term); if(!d) return null; ds=[d]}
  const cnt={}; ds.forEach(d=>{const k=JSON.stringify([d.grade||UNSET,d.term||UNSET]);cnt[k]=(cnt[k]||0)+1});
  return JSON.parse(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]);
}
function openNextTest(){const p=nextTestPath(); if(p){S.folder=p;drawDecks()}}
function openFolder(i){S.folder=S.folder.slice(0,i);drawDecks()}
function enterFolder(name){S.folder.push(name);drawDecks()}
function drawDecks(){
  const D=S.decks; S.folder=S.folder||[]; S.deckView=S.deckView||'folder';
  const cards=D.reduce((s,d)=>s+d.card_count,0), mastered=D.reduce((s,d)=>s+d.stats.mastered,0);
  const newestId=D.length?D[0].id:null;
  let body='', topNext='';
  if(!D.length){
    body=`<div class="card center"><p>まだ教材がありません。</p><button class="btn primary" onclick="showTab('make')">✨ 最初の教材を作る</button></div>`;
  }else if(S.deckView==='new'){
    body=D.map(d=>deckCardHtml(d,newestId,true)).join('');
  }else{
    // 今いるフォルダの中の教材
    const val=(d,k)=>d[k]||UNSET;
    const inHere=D.filter(d=>S.folder.every((name,i)=>val(d,LEVELS[i][0])===name));
    if(!inHere.length&&S.folder.length){S.folder=[];return drawDecks()}
    const crumbs=[`<button class="crumb" onclick="openFolder(0)">📚 すべて</button>`,
      ...S.folder.map((n,i)=>`<span class="muted">›</span><button class="crumb" onclick="openFolder(${i+1})">${esc(n)}</button>`)].join('');
    body=`<div class="crumbs">${crumbs}</div>`;
    if(S.folder.length<LEVELS.length){
      const key=LEVELS[S.folder.length][0];
      // フォルダは「中の一番新しい教材」が新しい順に並べる (新しいものが一番上)
      const groups=new Map();
      for(const d of inHere){const k=val(d,key);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(d)}
      const np=nextTestPath();
      if(S.folder.length===0){
        const latest=D.slice(0,2);
        const nl=np?D.filter(d=>(d.grade||UNSET)===np[0]&&(d.term||UNSET)===np[1]):[];
        const nc=nl.reduce((s,d)=>s+d.card_count,0), nm=nl.reduce((s,d)=>s+d.stats.mastered,0);
        const subs=[...new Set(nl.map(d=>d.subject||UNSET))];
        const nextBtn=nl.length?`<button class="folder" style="border:2px solid var(--accent)" onclick="openNextTest()">
          <span class="fi">📌</span><span class="grow"><span class="muted small">次のテスト</span><br><b>${esc(np[1])}</b> <span class="muted small">${esc(np[0])}</span><br>
          <span class="muted small">教材 ${nl.length}つ ・ カード ${nc}枚 ・ 覚えた ${nm}枚</span>
          <span class="fprev">${subs.slice(0,6).map(n=>`<span>📁${esc(n)}</span>`).join('')}</span></span>
          <span class="muted" style="font-size:22px">›</span></button>`:'';
        topNext=nextBtn;
        body=`<h3 style="margin:4px 0 8px">🆕 新しい教材</h3>${latest.map(d=>deckCardHtml(d,newestId,true)).join('')}<h3 style="margin:18px 0 8px">📂 フォルダ</h3>`+body;
      }
      // 次のテストのフォルダを一番上に、「未設定」は一番下に
      const lvl=S.folder.length, onPath=np&&lvl<2&&S.folder.every((n,i)=>np[i]===n)?np[lvl]:null;
      const rank=n=>n===onPath?0:n===UNSET?2:1;
      body+=[...groups.entries()].sort((a,b)=>rank(a[0])-rank(b[0])).map(([name,list])=>{
        const c=list.reduce((s,d)=>s+d.card_count,0), m=list.reduce((s,d)=>s+d.stats.mastered,0), rv=list.reduce((s,d)=>s+d.stats.in_review,0);
        const hasNew=list.some(d=>d.id===newestId||daysAgo(d.created_at)<3);
        return `<button class="folder" onclick="enterFolder(${esc(JSON.stringify(name))})">
          <span class="fi">📁</span><span class="grow"><b>${esc(name)}</b> ${hasNew?'<span class="chip new">NEW</span>':''}<br>
          <span class="muted small">教材 ${list.length}つ ・ カード ${c}枚 ・ 覚えた ${m}枚${rv?` ・ <span style="color:var(--ng)">復習 ${rv}</span>`:''}</span>
          ${folderPreview(list)}</span>
          <span class="muted" style="font-size:22px">›</span></button>`}).join('');
    }else{
      body+=inHere.map(d=>deckCardHtml(d,newestId,false)).join('');
    }
    if(S.folder.length) body+=`<div class="row" style="margin-top:6px"><button class="btn navy grow" onclick="openTestMaker(${esc(JSON.stringify(inHere.map(d=>d.id)))})">📝 テストを作る</button>
      <button class="btn grow" style="background:#fff6d6;color:#8a4b00" onclick="startPlan('final',${esc(JSON.stringify(inHere.map(d=>d.id)))},'直前チェック')">🎯 直前チェック（30問）</button></div>`;
  }
  setView(`
    ${examCardHtml()}
    ${topNext}
    <div class="stats">
      <div class="stat"><b>${D.length}</b><span>教材</span></div>
      <div class="stat"><b>${cards}</b><span>できたカード</span></div>
      <div class="stat"><b>${mastered}</b><span>覚えたカード</span></div>
    </div>
    ${D.length?`<div class="seg" style="margin-bottom:12px">
      <button class="${S.deckView==='folder'?'on':''}" onclick="S.deckView='folder';drawDecks()">📁 フォルダで見る</button>
      <button class="${S.deckView==='new'?'on':''}" onclick="S.deckView='new';drawDecks()">🆕 新しい順に全部</button></div>`:''}
    ${body}`);
}

// ------------------------------------------------------------ 教材の中身
async function openDeck(id){
  loading();
  try{ const r=await api('get_deck',{deck_id:id}); S.deck=r.deck; S.cards=r.cards; S.checked=new Set() }catch(e){ toast(e.message); return renderDecks() }
  drawDeck();
}
function drawDeck(){
  const d=S.deck, C=S.cards, word=d.card_kind==='word';
  const mastered=C.filter(c=>c.progress&&c.progress.correct_count>0&&!c.progress.in_review).length;
  const wrongEver=C.filter(c=>c.progress&&c.progress.wrong_count>0).length;
  const fixCnt=C.filter(c=>c.needs_regen).length;
  const so=S.studyOpts||(S.studyOpts={order:'seq',range:'all',reverse:false});
  const hasYear=C.some(c=>c.year!=null);
  if(so.order==='chrono'&&!hasYear) so.order='seq';
  setView(`
    <p><button class="btn ghost sm" onclick="showTab('decks')">‹ 教材一覧</button></p>
    <div class="card">
      <div class="chips">${d.subject?`<span class="chip">${esc(d.subject)}</span>`:''}${d.grade?`<span class="chip">${esc(d.grade)}</span>`:''}${d.term?`<span class="chip">${esc(d.term)}</span>`:''}<span class="chip">${word?'単語型':'問題型'}</span></div>
      <h2 style="margin:8px 0 4px">${esc(d.title)}</h2>
      <div class="muted small">カード ${C.length}枚 ・ 覚えた ${mastered}枚 ・ ${fmtDate(d.created_at)} 登録${d.memo?' ・ '+esc(d.memo):''}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="editDeck()">✏️ 教材の情報</button>
        <button class="btn sm" onclick="addCard()">＋ カード追加</button>
        ${d.source_text?`<button class="btn sm" onclick="showSource()">📄 読み取った内容</button>`:''}
        ${d.source_text?`<button class="btn sm" onclick="reorderDeck()">🔢 並び順を直す</button>`:''}
        <button class="btn sm navy" onclick="openTestMaker([${d.id}])">📝 テストを作る</button>
      </div>
    </div>

    <div class="card">
      ${(()=>{const ri=resumeInfo('deck:'+d.id);return ri&&ri.at<ri.n?`<button class="btn navy block" style="margin-bottom:12px;font-size:17px" onclick="resumeStudy('deck:${d.id}',()=>openDeck(${d.id}),S.cards)">⏯ 前回の続きから（${ri.at+1}問目から／全${ri.n}問）</button>`:''})()}
      <h3>▶ 出題する</h3>
      <label class="f">出す順番</label>
      <div class="seg" id="segOrder">
        <button class="${so.order==='seq'?'on':''}" onclick="setSO('order','seq')">教材の順番</button>
        ${hasYear?`<button class="${so.order==='chrono'?'on':''}" onclick="setSO('order','chrono')">時系列（年代順）</button>`:''}
        <button class="${so.order==='rand'?'on':''}" onclick="setSO('order','rand')">ランダム</button>
        <button class="${so.order==='freq'?'on':''}" onclick="setSO('order','freq')">頻出順</button>
      </div>
      ${so.order==='freq'?`<p class="muted small" style="margin:6px 0 0">テスト直前向け：AIが付けた「頻出度★」（一般的な中間・期末テストでよく出るか）の高い順。同じ★の中では、よくまちがえるカードが先です。${C.some(c=>c.importance!=null)?'':'<br>この教材にはまだ★がないので、はじめるときにAIが付けます（30秒ほど）。'}</p>`:''}
      ${((d.subject==='歴史'&&d.source_text)||hasYear)?`<p class="muted small" style="margin:6px 0 0">${hasYear?'「教材の順番」は教科書・プリント通り、「時系列」は西暦の古い順です。':'時系列で出すには、上の「🔢 並び順を直す」を一度押してください。'}</p>`:''}
      <label class="f">出す範囲</label>
      <div class="seg">
        <button class="${so.range==='all'?'on':''}" onclick="setSO('range','all')">全部 (${C.length})</button>
        <button class="${so.range==='notyet'?'on':''}" onclick="setSO('range','notyet')">まだ覚えてない (${C.length-mastered})</button>
        <button class="${so.range==='wrong'?'on':''}" onclick="setSO('range','wrong')">間違えた (${wrongEver})</button>
      </div>
      <label class="f">向き（表と裏）</label><div class="seg">
        <button class="${!so.reverse?'on':''}" onclick="setSO('reverse',false)">${word?'単語 → 意味':'問題 → 答え（ふつう）'}</button>
        <button class="${so.reverse?'on':''}" onclick="setSO('reverse',true)">${word?'意味 → 単語':'答え → 問題（逆）'}</button></div>
      <label class="f">答え方</label>${answerSeg(so.answer,"setSO('answer','%')")}
      <button class="btn primary block" style="margin-top:14px;font-size:18px" onclick="startDeckStudy()">はじめる</button>
    </div>

    <div class="card">
      <div class="row"><h3 class="grow" style="margin:0">問題の一覧 (${C.length})</h3>

      <div class="row small" style="margin:6px 0"><button class="btn sm ghost" onclick="checkAll(true)">全部チェック</button><button class="btn sm ghost" onclick="checkAll(false)">チェックを外す</button></div>

            <div class="q">${esc(c.question)}</div>
            <div class="a ${S.hideAns?'hide':''}">${esc(c.answer)}</div>
            <div class="chips" style="margin-top:3px">${c.importance?`<span class="chip" style="background:#fff6d6;color:#8a6500" title="頻出度（テストでよく出るか）">${'★'.repeat(c.importance)}</span>`:''}${c.tag?`<span class="chip">${esc(c.tag)}</span>`:''}${c.year!=null&&!(c.tag||'').includes(String(Math.abs(c.year)))?`<span class="chip">${c.year<0?'紀元前'+(-c.year):c.year}年</span>`:''}
              ${p.correct_count?`<span class="chip ok">○${p.correct_count}</span>`:''}${p.wrong_count?`<span class="chip rev">×${p.wrong_count}</span>`:''}
              ${p.in_review?'<span class="chip rev">復習中</span>':''}${c.needs_regen?'<span class="chip fix">作り直し待ち</span>':''}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px"><button class="ed" title="手直し" onclick="editCard(${c.id})">✏️</button>

        </li>`}).join('')}</ul>
    </div>
    <div id="actBar"></div>
    <p class="center"><button class="btn danger sm" onclick="deleteDeck()">この教材を削除</button></p>
  `);
  drawActBar();
}
function setSO(k,v){S.studyOpts[k]=v;const y=window.scrollY;drawDeck();window.scrollTo(0,y)}
function toggleCheck(id,on){on?S.checked.add(id):S.checked.delete(id);drawActBar()}
function checkAll(on){S.checked=on?new Set(S.cards.map(c=>c.id)):new Set();const y=window.scrollY;drawDeck();window.scrollTo(0,y)}
function drawActBar(){
  const n=S.checked.size, el=$('#actBar'); if(!el) return;
  if(!n){el.innerHTML='';return}
  el.innerHTML=`<div class="sticky-act">
    <div class="row" style="margin-bottom:8px"><b class="grow">${n}問を選択中</b><button class="btn sm danger" onclick="deleteChecked()">🗑 選んだ${n}問を削除</button></div>
    <textarea class="t" id="regenOrder" placeholder="作り直しの注文（例：答えが人物名になるように／もっと易しく／読みがなも付けて）"></textarea>
    <button class="btn primary block" style="margin-top:8px" onclick="regenerate()">🔄 チェックした${n}問をAIで作り直す</button></div>`;
}
async function regenerate(){
  const ids=[...S.checked], ins=($('#regenOrder')||{}).value||'';
  const bar=$('#actBar'); bar.innerHTML=`<div class="sticky-act"><span class="spinner"></span> ${ids.length}問を作り直しています…（1分ほどかかります）</div>`;
  try{
    for(const id of ids) api('update_card',{card_id:id,needs_regen:true}).catch(()=>{});
    const r=await api('regenerate',{deck_id:S.deck.id,card_ids:ids,instructions:ins});
    toast(`${r.updated}問を作り直しました`); openDeck(S.deck.id);
  }catch(e){toast(e.message,5000);drawActBar()}
}
async function removeCards(ids){
  const y=window.scrollY;

function startDeckStudy(){
  const so=S.studyOpts; let list=S.cards.slice();
  if(so.range==='notyet') list=list.filter(c=>!(c.progress&&c.progress.correct_count>0&&!c.progress.in_review));
  if(so.range==='wrong') list=list.filter(c=>c.progress&&c.progress.wrong_count>0);
  if(!list.length) return toast('出せる問題がありません');
  if(so.order==='rand') list=shuffle(list);
  if(so.order==='chrono') list=chronoSort(list);
  if(so.order==='freq'){
    if(!S.cards.some(c=>c.importance!=null)) return rateAndStart();
    list=freqSort(list);
  }
  const d=S.deck;
  dropResume('deck:'+d.id);
  startStudy(list,{mode:'normal',reverse:!!so.reverse,title:d.title,word:d.card_kind==='word',...ansOpts(so.answer),pool:S.cards,resumeKey:'deck:'+d.id,
    rec:{profile_id:S.profile.id,deck_id:d.id,deck_title:d.title,subject:d.subject},back:()=>openDeck(d.id)});
}
// 頻出順: ★(テストに出やすさ)の高い順 → まちがえた回数が多い順 → 教材の順
function freqSort(list){
  return list.map((c,k)=>({c,k,i:c.importance!=null?c.importance:3,w:(c.progress&&c.progress.wrong_count)||0,
    r:c.progress&&c.progress.in_review?1:0})).sort((a,b)=>b.i-a.i||b.r-a.r||b.w-a.w||a.k-b.k).map(x=>x.c);
}

  toast('AIが「頻出度★」を付けています…（30秒ほど）',40000);
  try{ const r=await api('rate_importance',{deck_id:S.deck.id}); toast(`${r.updated}枚に★を付けました`);
    const d=await api('get_deck',{deck_id:S.deck.id}); S.deck=d.deck; S.cards=d.cards; drawDeck(); startDeckStudy();
  }catch(e){toast(e.message,5000)}

// 西暦で古い順に並べる。西暦のないカードは、プリントで直前にあるカードの年に続ける
function chronoSort(list){
  let last=-1e9; const withY=list.map((c,k)=>{if(c.year!=null)last=c.year;return {c,y:c.year!=null?c.year:last,k}});
  return withY.sort((a,b)=>a.y-b.y||a.k-b.k).map(x=>x.c);
}
let ST=null;

function startStudy(cards,o){
  ST={cards,i:0,shown:false,res:new Array(cards.length),picked:new Array(cards.length),choiceMap:{},startedAt:new Date().toISOString(),...o};
  document.body.style.overflow='hidden';
  drawStudy();
}
function studyPayload(){
  if(!ST) return null;
  const answers=[], wrong=[];
  ST.cards.forEach((c,k)=>{const r=ST.res[k]; if(r===undefined||(ST.recorded&&ST.recorded.has(k))) return; answers.push({card_id:c.id,correct:r}); if(!r) wrong.push({q:c.question,a:c.answer})});
  if(!answers.length) return null;
  return {...ST.rec,mode:ST.mode,answer_mode:ST.choice?'choice':ST.typeMode?'type':'flip',started_at:ST.startedAt,answers,wrong_items:wrong};
}

// ---- 途中から再開: どこまで進んだかを覚えておく (この端末に保存)
// 容量を取らないよう、保存するのは「カードの番号」と「○×の印」だけ。1人につき最新10個まで(1個約0.25KB)。
const RESUME_MAX=10;
function resumeKeyOf(k){return 'flash_resume_'+(S.profile?S.profile.id:0)+'_'+k}
function resumeIndexKey(){return 'flash_resume_idx_'+(S.profile?S.profile.id:0)}
function dropResume(k){lsSet(resumeKeyOf(k),null);let idx=[];try{idx=JSON.parse(lsGet(resumeIndexKey())||'[]')}catch(e){}lsSet(resumeIndexKey(),JSON.stringify(idx.filter(x=>x!==k)))}
function saveResume(){
  if(!ST||!ST.resumeKey) return;
  const n=ST.cards.length, done=ST.res.filter(r=>r!==undefined).length;
  if(done>=n){ dropResume(ST.resumeKey); return }
  if(!done) return;
  const k=ST.resumeKey;
  lsSet(resumeKeyOf(k),JSON.stringify({ids:ST.cards.map(c=>c.id),r:Array.from({length:n},(_,i)=>ST.res[i]===true?'1':ST.res[i]===false?'0':'-').join(''),
    d:[...new Set(ST.cards.map(c=>c.deck_id).filter(Boolean))],t:Date.now(),
    o:{mode:ST.mode,reverse:!!ST.reverse,title:ST.title,word:!!ST.word,choice:!!ST.choice,typeMode:!!ST.typeMode,rec:ST.rec}}));
  let idx=[];try{idx=JSON.parse(lsGet(resumeIndexKey())||'[]')}catch(e){}
  idx=[k,...idx.filter(x=>x!==k)];
  idx.slice(RESUME_MAX).forEach(old=>lsSet(resumeKeyOf(old),null));
  lsSet(resumeIndexKey(),JSON.stringify(idx.slice(0,RESUME_MAX)));
}
function loadResume(k){try{const r=JSON.parse(lsGet(resumeKeyOf(k))||'null');if(r&&r.ids&&Date.now()-r.t<30*864e5)return r;if(r)dropResume(k)}catch(e){}return null}
function resumeInfo(k){const r=loadResume(k);if(!r)return null;const n=r.ids.length;let at=0;while(at<n&&(r.r[at]==='1'||r.r[at]==='0'))at++;return {n,at}}
async function resumeStudy(k,back,fresh){
  const r=loadResume(k); if(!r) return toast('続きが見つかりませんでした');
  // 問題の中身はサーバーから読み直す(消したカードは飛ばす)
  let pool=fresh;
  if(!pool){ pool=[...(S.review||[])];
    for(const did of r.d||[]){ try{ pool.push(...(await api('get_deck',{deck_id:did})).cards) }catch(e){} } }
  const byId=new Map(); pool.forEach(c=>{if(!byId.has(c.id))byId.set(c.id,c)});
  const keep=r.ids.map((id,i)=>[byId.get(id),r.r[i]]).filter(x=>x[0]);
  if(!keep.length){ dropResume(k); return toast('続きのカードがもうありません') }
  startStudy(keep.map(x=>x[0]),{...r.o,pool,resumeKey:k,back});
  ST.res=keep.map(x=>x[1]==='1'?true:x[1]==='0'?false:undefined);
  ST.recorded=new Set(ST.res.map((x,i)=>x===undefined?-1:i).filter(i=>i>=0));
  const first=ST.res.findIndex(x=>x===undefined); ST.i=first<0?ST.cards.length:first; ST.shown=false;
  toast(`${ST.i+1}問目から再開します`,2000); drawStudy();
}

// ---- 解説 (Sonnetで速く→「もっと詳しく」はOpus。一度作ったら保存して次からはすぐ出す)
function fmtExplain(t){
  return esc(t).replace(/【([^】]+)】/g,'<div style="font-weight:800;color:var(--navy);margin-top:10px">【$1】</div>').replace(/\n/g,'<br>').replace(/(<\/div>)(<br>)+/g,'$1');
}
let EX=null;
function openExplain(){
  const c=ST.cards[ST.i], picked=ST.choice&&ST.res[ST.i]===false?ST.picked[ST.i]:'';
  EX={c,picked,wrong:ST.res[ST.i]===false};
  modal(`<div class="row"><h3 class="grow" style="margin:0">💡 解説</h3><button class="btn sm ghost" onclick="closeModal()">閉じる</button></div>
    <div class="small" style="margin:8px 0;background:var(--chip);border-radius:10px;padding:8px 10px">
      <div>${esc(c.question)}</div><div style="font-weight:800;color:var(--navy)">→ ${esc(c.answer)}</div>
      ${picked?`<div style="color:var(--ng)">あなたが選んだ答え：${esc(picked)}</div>`:''}</div>
    <div id="exBody" style="font-size:15px;line-height:1.75;min-height:60px"></div>
    <div class="muted" style="font-size:11px;margin-top:8px">🤖 AIが作成した解説です</div>
    <div class="row" style="margin-top:10px"><button class="btn navy grow" id="exMore" onclick="explainDetail(false)">🔎 もっと詳しく</button><button class="btn ghost" onclick="runExplain(true)">🔄 作り直す</button></div>
    <div id="exDetail"></div>`);
  runExplain(false);
}
function splitExplain(c,text,picked){
  const i=text.indexOf('【選んだ答え'); const general=(i>=0?text.slice(0,i):text).trim(), p4=i>=0?text.slice(i).trim():'';
  if(general) c.explain=general;
  if(picked&&p4){c.explain_choices={...(c.explain_choices||{}),[picked]:p4}}
}
async function runExplain(regen){
  const e=EX, c=e.c, body=$('#exBody'); if(!body) return;
  const cached=!regen&&c.explain&&(!e.picked||(c.explain_choices||{})[e.picked]);
  if(cached){ body.innerHTML=fmtExplain(c.explain+(e.picked?'\n\n'+c.explain_choices[e.picked]:'')); return }
  body.innerHTML='<span class="spinner"></span> <span class="muted small">解説を作っています…</span>';
  try{
    const text=await streamApi('explain',{card_id:c.id,picked:e.picked,regenerate:!!regen},t=>{if(EX===e&&$('#exBody'))$('#exBody').innerHTML=fmtExplain(t)+'<span class="spinner" style="width:12px;height:12px;margin-left:4px"></span>'});
    if(EX===e&&$('#exBody')) $('#exBody').innerHTML=fmtExplain(text);
    if(!/（[^）]*(エラー|つながり|混み合|断り|鍵)/.test(text)) splitExplain(c,text,e.picked);
  }catch(err){ if($('#exBody')) $('#exBody').innerHTML=`<p class="small" style="color:var(--ng)">${esc(err.message)}</p>` }
}
async function explainDetail(regen){
  const e=EX, c=e.c, box=$('#exDetail'); if(!box) return;
  box.innerHTML=`<div class="card" style="margin:12px 0 0;padding:12px;border:2px solid var(--chip)">
    <div class="row"><b class="grow">🔎 もっと詳しく</b><button class="btn sm ghost" onclick="explainDetail(true)">🔄 作り直す</button></div>
    <div id="exDetailBody" style="font-size:15px;line-height:1.75;margin-top:6px">${c.explain_detail&&!regen?fmtExplain(c.explain_detail):'<span class="spinner"></span> <span class="muted small">くわしく考えています…（Opus・少し時間がかかります）</span>'}</div>
    <div class="muted" style="font-size:11px;margin-top:8px">🤖 AIが作成した解説です</div></div>`;
  $('#exMore')&&$('#exMore').classList.add('hidden');
  box.scrollIntoView({behavior:'smooth',block:'start'});
  if(c.explain_detail&&!regen) return;
  try{
    const text=await streamApi('explain_detail',{card_id:c.id,regenerate:!!regen},t=>{if(EX===e&&$('#exDetailBody'))$('#exDetailBody').innerHTML=fmtExplain(t)+'<span class="spinner" style="width:12px;height:12px;margin-left:4px"></span>'});
    if(EX===e&&$('#exDetailBody')) $('#exDetailBody').innerHTML=fmtExplain(text);
    if(!/（[^）]*(エラー|つながり|混み合|断り|鍵)/.test(text)) c.explain_detail=text.trim();
  }catch(err){ if($('#exDetailBody')) $('#exDetailBody').innerHTML=`<p class="small" style="color:var(--ng)">${esc(err.message)}</p>` }
}
// ---- 4択モード: 選択肢は同じ教材のほかのカードの答えから作る (AIは使わない)
function makeChoices(c){
  const key=c.id+'|'+(ST.reverse?1:0); if(ST.choiceMap[key]) return ST.choiceMap[key];
  const side=x=>(ST.reverse?x.question:x.answer).trim(), right=side(c);
  const seen=new Set([right]), cands=[];
  for(const x of (ST.pool||ST.cards)){ if(x.id===c.id) continue; const t=side(x); if(!t||seen.has(t)) continue; seen.add(t); cands.push({t,x}) }
  // 同じラベル(時代・品詞)・近い長さのものを優先して、まぎらわしい選択肢にする
  cands.forEach(o=>{o.s=(o.x.tag&&o.x.tag===c.tag?0:2)+Math.abs(o.t.length-right.length)/Math.max(4,right.length)+Math.random()*1.2});
  const wrong=cands.sort((p,q)=>p.s-q.s).slice(0,3).map(o=>o.t);
  return ST.choiceMap[key]=shuffle([right,...wrong]);
}

async function gradeTyped(){
  const inp=$('#typeIn'); if(!inp) return; const given=inp.value.trim(); if(!given) return toast('答えを入れてください');
  const c=ST.cards[ST.i], at=ST.i, right=(ST.reverse?c.question:c.answer);
  const nz=x=>String(x||'').normalize('NFKC').toLowerCase().replace(/[\s、。，．,.・「」『』()（）①-⑳]/g,'');
  let res;
  if(right.split(/[／/]/).some(x=>nz(x)===nz(given))||nz(right)===nz(given)) res={ok:true,comment:''};
  else{ $('#typeBtn').innerHTML='<span class="spinner"></span>'; $('#typeBtn').disabled=true;
    try{ res=await api('grade_typed',{card_id:c.id,given,reverse:!!ST.reverse}) }catch(e){ toast(e.message); res={ok:false,comment:'判定できませんでした。「やっぱり○にする」で直せます'} } }
  if(!ST||ST.i!==at) return;
  ST.typed=ST.typed||{}; ST.typed[at]={given,comment:res.comment||''}; ST.res[at]=!!res.ok; keepPending(); drawStudy();
  if(res.ok&&!res.comment) setTimeout(()=>{if(ST&&ST.i===at){ST.i++;drawStudy()}},900);
}

function pickChoice(k){

  ST.picked[ST.i]=t; ST.res[ST.i]=ok; keepPending(); drawStudy();
  if(ok){const at=ST.i;setTimeout(()=>{if(ST&&ST.i===at){ST.i++;drawStudy()}},800)}
}
function swapSides(){ST.reverse=!ST.reverse;ST.shown=false;drawStudy();toast(ST.reverse?'裏→表の向きで出します':'ふつうの向きに戻しました',1800)}
function editStudyCard(){

}
function unflip(){ST.shown=false;drawStudy()}
function judge(ok){
  ST.res[ST.i]=ok;

  ST.i++;keepPending();ST.shown=ST.res[ST.i]!==undefined;drawStudy();
}
function prevCard(){if(ST.i>0){ST.i--;ST.shown=true;drawStudy()}}

function drawResult(){
  if(ST.resumeKey) dropResume(ST.resumeKey);

    <div class="card result">

      ${wrong.length?`<p class="small" style="margin-top:14px">間違えた${wrong.length}問は「🔁 復習」に入ります。</p>`:'<p>全問正解！</p>'}

        <button class="btn block" onclick="quitStudy()">記録してもどる</button>
      </div></div></div></div>`;
}

function drawTaking(){
  const t=S.test, tk=S.taking;
  $('#studyRoot').innerHTML=`<div class="study" style="overflow:auto;display:block">
    <div class="head" style="position:sticky;top:0;background:var(--bg);z-index:2"><button class="btn sm ghost" onclick="quitTaking()">✕</button><b class="grow">📝 ${esc(t.title)}</b><span class="muted small" id="tkCount"></span></div>
    <div class="wrap" style="padding-bottom:40px">
    ${tk.idx.map((qi,k)=>{const q=t.questions[qi];const typ=(TEST_TYPES.find(x=>x[0]===q.type)||['',''])[1];return `<div class="card">
      <div class="muted small">問${k+1} ・ ${typ}</div><div style="font-size:17px;font-weight:700;margin:6px 0 10px;white-space:pre-wrap">${esc(q.question)}</div>
      ${q.type==='choice'||q.type==='tf'?`<div style="display:grid;gap:8px;${q.type==='tf'?'grid-template-columns:1fr 1fr':''}">${q.choices.map(c=>`<button class="btn ${tk.answers[k]===c?'navy':'ghost'}" style="text-align:left;${q.type==='tf'?'text-align:center;font-size:22px':''}" onclick="S.taking.answers[${k}]=${esc(JSON.stringify(c))};drawTaking()">${esc(c)}</button>`).join('')}</div>`
        :q.type==='written'?`<textarea class="t" oninput="S.taking.answers[${k}]=this.value;tkCount()" placeholder="ここに書く">${esc(tk.answers[k])}</textarea>`
        :`<input class="t" oninput="S.taking.answers[${k}]=this.value;tkCount()" placeholder="答え" value="${esc(tk.answers[k])}">`}
    </div>`}).join('')}
    <button class="btn primary block" style="font-size:18px;padding:16px" onclick="submitTest()">採点する</button>
    </div></div>`;
  tkCount();
}
function tkCount(){const tk=S.taking,el=$('#tkCount');if(el)el.textContent=`${tk.answers.filter(a=>String(a).trim()).length}/${tk.idx.length} 回答`}
function quitTaking(){if(!confirm('テストをやめますか？（答えは保存されません）'))return;S.taking=null;$('#studyRoot').innerHTML='';document.body.style.overflow=''}
async function submitTest(){
  const tk=S.taking, blank=tk.answers.filter(a=>!String(a).trim()).length;
  if(blank&&!confirm(`まだ答えていない問題が${blank}問あります。このまま採点しますか？`)) return;
  $('#studyRoot').innerHTML=`<div class="study"><div class="flash" style="justify-content:center;text-align:center"><p><span class="spinner"></span> 採点しています…</p><p class="muted small">一問一答・記述はAIが採点します（10〜30秒）</p></div></div>`;
  try{
    const r=await api('submit_test',{test_id:S.test.id,answers:tk.answers,only:tk.only,started_at:tk.startedAt});
    S.taking=null; S.testAtts.unshift(r.attempt); drawAttempt(r.attempt,true);
  }catch(e){ toast(e.message,5000); drawTaking() }
}
function showAttempt(k){document.body.style.overflow='hidden';drawAttempt(S.testAtts[k],false)}
function drawAttempt(a,fresh){
  const t=S.test, pct=a.total?Math.round(a.score/a.total*100):0, wrong=a.results.filter(r=>!r.ok);
  $('#studyRoot').innerHTML=`<div class="study" style="overflow:auto;display:block">
    <div class="head" style="position:sticky;top:0;background:var(--bg);z-index:2"><button class="btn sm ghost" onclick="closeAttempt()">✕</button><b class="grow">📝 ${esc(t.title)} の結果</b></div>
    <div class="wrap" style="padding-bottom:40px">
      <div class="card result"><div style="font-size:40px">${pct===100?'🎉':pct>=70?'👏':'💪'}</div><div class="big">${a.score} / ${a.total}</div><div class="muted">正解率 ${pct}%</div>
        ${fresh&&wrong.length?`<p class="small">まちがえた問題の元のカードは「🔁 復習」に入りました。</p>`:''}
        <div style="display:grid;gap:8px;margin-top:10px">
          ${wrong.length?`<button class="btn primary block" onclick="takeTest(${esc(JSON.stringify(wrong.map(r=>r.index)))})">まちがえた${wrong.length}問だけ解き直す</button>`:''}
          <button class="btn block" onclick="closeAttempt()">閉じる</button></div></div>
      ${a.results.map((r,k)=>{const q=t.questions[r.index]||{};return `<div class="card" style="border-left:6px solid ${r.ok?'var(--ok)':'var(--ng)'}">
        <div class="row"><b style="font-size:22px;color:${r.ok?'var(--ok)':'var(--ng)'}">${r.ok?'○':'✕'}</b><span class="muted small grow">問${r.index+1}</span></div>
        <div style="font-weight:700;margin:4px 0 8px;white-space:pre-wrap">${esc(q.question)}</div>
        <div class="small">あなたの答え：<b>${esc(r.given||'（未回答）')}</b></div>
        ${!r.ok||q.type==='written'?`<div class="small" style="margin-top:4px">正解：<b style="color:var(--navy)">${esc(q.answer)}</b></div>`:''}
        ${r.comment&&r.comment!=='未回答'?`<div class="small" style="margin-top:6px;background:var(--accent-soft);border-radius:8px;padding:6px 8px">🧑‍🏫 ${esc(r.comment)}</div>`:''}
        ${q.explanation?`<div class="note small" style="margin-top:6px">💡 ${esc(q.explanation)}</div>`:''}
      </div>`}).join('')}
    </div></div>`;
}
function closeAttempt(){$('#studyRoot').innerHTML='';document.body.style.overflow='';openTest(S.test.id)}
async function deleteTest(){
  if(!confirm(`「${S.test.title}」と、これまでの結果を削除します。よろしいですか？`)) return;
  try{ await api('delete_test',{test_id:S.test.id}); toast('削除しました'); S.histView='test'; showTab('history') }catch(e){toast(e.message)}
}

      <div class="chips">${t.subject?`<span class="chip">${esc(t.subject)}</span>`:''}${l?`<span class="chip ${lp>=80?'ok':lp<50?'rev':''}">前回 ${l.score}/${l.total}</span>`:'<span class="chip new">まだ受けていない</span>'}</div>
      <div class="tt">📝 ${esc(t.title)}</div>
      <div class="muted small">${fmtDate(t.created_at)} 作成 ・ 受けた回数 ${t.attempts}回${b?` ・ 最高 ${b.score}/${b.total}`:''}</div></button>`}).join('')
    :'<div class="card center"><p>まだテストがありません。<br>教材を開いて「📝 テストを作る」を押すと作れます。</p></div>'}`);

function histSeg(){return `<h2>📈 ${esc(S.profile.name)}の記録</h2><div class="seg" style="margin-bottom:12px">
  <button class="${!['test','growth'].includes(S.histView)?'on':''}" onclick="S.histView='study';renderHistory()">学習の記録</button>
  <button class="${S.histView==='growth'?'on':''}" onclick="S.histView='growth';renderHistory()">📊 科目ごと</button>
  <button class="${S.histView==='test'?'on':''}" onclick="S.histView='test';renderHistory()">📝 テスト</button></div>`}

// 学習の記録の科目名から、その科目の成長グラフへ
async function openSubjectGrowth(subject){
  S.histView='growth'; await renderHistory();
  const el=document.querySelector(`[data-subject="${CSS.escape(subject)}"]`);
  if(!el) return toast(`${subject} のグラフはまだありません`);
  el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.add('flash-hl'); setTimeout(()=>el.classList.remove('flash-hl'),2200);

async function setSessionMode(id,mode){
  try{ await api('set_session_mode',{session_id:id,answer_mode:mode}); toast(mode==='choice'?'「4択」にしました':'「自分で答えた」にしました'); const y=window.scrollY; await renderHistory(); window.scrollTo(0,y) }catch(e){toast(e.message)}
}
// ------------------------------------------------------------ 科目ごとの成長
// やった分は全部まとめて1つのグラフに。答え方ごとに折れ線の色を分ける。
const GMODES=[['flip','自分で答える','#1f9d63'],['type','入力して答える','#3b82f6'],['choice','4択','#ff7a45'],['mixed','以前の記録（区別なし）','#9aa1b2']];
const MIN_N=3; // 解いた数が少なすぎる点はぶれるので描かない
const pctOf=x=>x&&x.n>=MIN_N?Math.round(x.ok/x.n*100):null;
function miniChart(labels,series){
  const W=160,H=80,L=4,R=4,T=10,B=14, w=W-L-R, h=H-T-B, n=labels.length;
  const X=i=>L+(n<=1?w/2:i*w/(n-1)), Y=v=>T+h-(v/100)*h;
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  [0,50,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1f7" stroke-width="1"/>`});
  labels.forEach((t,i)=>{if(i===0||i===n-1||n<=5)g+=`<text x="${X(i)}" y="${H-3}" font-size="8" text-anchor="${i===0&&n>1?'start':i===n-1&&n>1?'end':'middle'}" fill="#8a91a3">${esc(t)}</text>`});
  for(const sr of series){
    const pts=sr.values.map((v,i)=>v==null?null:[X(i),Y(v),v]).filter(Boolean); if(!pts.length) continue;
    if(pts.length>1) g+=`<polyline fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round"${sr.dash?` stroke-dasharray="${sr.dash}"`:''} points="${pts.map(p=>p[0]+','+p[1]).join(' ')}"/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.2" fill="${sr.color}"/>`});
    const l=pts[pts.length-1], left=l[0]<30; g+=`<text x="${left?l[0]+3:Math.min(l[0]+1,W-R)}" y="${l[1]-4}" font-size="8.5" font-weight="700" fill="${sr.color}" text-anchor="${left?'start':'end'}">${l[2]}%</text>`;
  }
  return g+'</svg>';
}
const DECK_COLORS=['#6366f1','#e11d48','#0ea5e9','#a855f7','#ca8a04','#14b8a6']; // 答え方の色(緑・橙・青)とかぶらない色
const MODE_DASH={flip:'',type:'5 2',choice:'2 2',mixed:'1 3'};
const MODE_SHORT={flip:'自分で',type:'入力',choice:'4択',mixed:'以前'};
async function renderGrowth(){
  let g; try{ g=await api('growth',{profile_id:S.profile.id}) }catch(e){ setView(histSeg()+`<div class="card">${esc(e.message)}</div>`); return }
  const mOf=r=>['choice','mixed','type'].includes(r.ans_mode)?r.ans_mode:'flip';
  // 科目 (理科は 化学・生物 などテスト科目ごと) → 教材 × 答え方 の線
  const subs={}, get=k=>subs[k]=subs[k]||{days:{},att:{},n:0,used:new Set(),decks:{},sk:{}};
  const skOf=(x,r)=>{const dk=String(r.deck_id??'x'), m=mOf(r); x.decks[dk]=x.decks[dk]||{title:r.deck_title||'',n:0}; x.used.add(m); const k=dk+'|'+m; x.sk[k]={dk,m}; return k};
  g.daily.forEach(r=>{const x=get(r.subject||'その他'), k=skOf(x,r);(x.days[r.d]=x.days[r.d]||{})[k]={n:r.n,ok:r.ok};x.n+=r.n;x.decks[String(r.deck_id??'x')].n+=r.n});
  g.attempts.forEach(r=>{const x=get(r.subject||'その他'), k=skOf(x,r);(x.att[r.a]=x.att[r.a]||{})[k]={n:r.n,ok:r.ok}});
  const names=Object.keys(subs).sort((a,b)=>subs[b].n-subs[a].n);
  const usedAll=new Set(); names.forEach(n=>subs[n].used.forEach(m=>usedAll.add(m)));
  const anyMulti=names.some(n=>Object.keys(subs[n].decks).length>1);
  const rows=names.map(name=>{
    const x=subs[name], m=(g.mastery||{})[name]||{cards:0,mastered:0};
    const dks=Object.keys(x.decks).sort((a,b)=>x.decks[b].n-x.decks[a].n), multi=dks.length>1;
    const dcol={}; dks.forEach((d,i)=>dcol[d]=DECK_COLORS[i%DECK_COLORS.length]);
    const modeOrder=GMODES.map(([k])=>k);
    const keys=Object.keys(x.sk).sort((a,b)=>dks.indexOf(x.sk[a].dk)-dks.indexOf(x.sk[b].dk)||modeOrder.indexOf(x.sk[a].m)-modeOrder.indexOf(x.sk[b].m));
    const styleOf=k=>{const {dk,m}=x.sk[k]; return multi?{color:dcol[dk],dash:MODE_DASH[m]}:{color:(GMODES.find(z=>z[0]===m)||[])[2],dash:''}};
    const days=Object.keys(x.days).sort(); let buckets=[], weekly=false;
    if(days.length){
      weekly=(new Date(days[days.length-1])-new Date(days[0]))/864e5>13;
      const keyOf=d=>{if(!weekly)return d;const t=new Date(d+'T00:00:00');t.setDate(t.getDate()-((t.getDay()+6)%7));return dayKey(t)};
      const bm={}; days.forEach(d=>{const k=keyOf(d), b=bm[k]=bm[k]||{};
        Object.entries(x.days[d]).forEach(([sk,v])=>{const t=b[sk]=b[sk]||{n:0,ok:0};t.n+=v.n;t.ok+=v.ok})});
      buckets=Object.keys(bm).sort().map(k=>({label:k.replace(/^\d+-0?(\d+)-0?(\d+)$/,'$1/$2'),v:bm[k]}))
        .filter(b=>Object.values(b.v).some(t=>t.n>=MIN_N));
    }
    const atts=[1,2,3,4,5].map(a=>x.att[a]||{});
    const attSeries=keys.map(k=>({k,...styleOf(k),values:atts.map(a=>pctOf(a[k]))})).filter(sr=>sr.values.some(v=>v!=null));
    const daySeries=keys.map(k=>({k,...styleOf(k),values:buckets.map(b=>pctOf(b.v[k]))})).filter(sr=>sr.values.some(v=>v!=null));
    const attOk=attSeries.some(sr=>sr.values.filter(v=>v!=null).length>=2)||(attSeries.length>=2);
    const nowOf=k=>{for(let i=buckets.length-1;i>=0;i--){const v=pctOf(buckets[i].v[k]);if(v!=null)return v}return null};
    const growOf=k=>{const v=atts.map(a=>pctOf(a[k])).filter(z=>z!=null);return v.length>=2?v[v.length-1]-v[0]:null};
    const modesOfDeck=dk=>keys.filter(k=>x.sk[k].dk===dk).length;
    const short=t=>t.length>9?t.slice(0,9)+'…':t;
    const stat=keys.map(k=>{const now=nowOf(k), gr=growOf(k);if(now==null&&gr==null)return '';
      const {dk,m}=x.sk[k], st=styleOf(k);
      const lab=multi?esc(short(x.decks[dk].title))+(modesOfDeck(dk)>1||m!=='flip'?`<span class="muted">(${MODE_SHORT[m]})</span>`:''):MODE_SHORT[m];
      return `<span style="white-space:nowrap"><b style="color:${st.color}">${multi&&st.dash?'┅':'●'}</b>${lab} <b>${now!=null?now+'%':'—'}</b>${gr!=null?` <span style="color:${gr>=0?'var(--ok)':'var(--ng)'}">${gr>=0?'+':''}${gr}</span>`:''}</span>`}).join(' ');
    const legend=multi?`<div style="display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11px;margin:2px 0">${dks.map(d=>`<span><b style="color:${dcol[d]}">━</b> ${esc(x.decks[d].title)}</span>`).join('')}</div>`:'';
    return `<div class="card" data-subject="${esc(name)}" style="padding:10px 12px;margin-bottom:8px;scroll-margin-top:110px">
      <div class="row" style="gap:6px"><b>${esc(name)}</b><span class="muted small grow">解いた数 ${x.n}問</span><span class="small muted">覚えた ${m.cards?Math.round(m.mastered/m.cards*100)+'%':'—'}</span>
        <button class="subj-link" onclick="openAnalysis({subject:${esc(JSON.stringify(name))}})">🔍 分析</button></div>
      ${legend}
      <div class="small" style="display:flex;flex-wrap:wrap;gap:4px 10px;margin:2px 0 4px">${stat}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div><div class="muted" style="font-size:10px">同じ問題・何回目</div>${attOk?miniChart(['1回','2','3','4','5回〜'],attSeries):'<div class="muted" style="font-size:11px;padding:14px 0">2回以上解くと出ます</div>'}</div>
        <div><div class="muted" style="font-size:10px">${weekly?'週':'日'}ごとの正答率</div>${buckets.length>=2?miniChart(buckets.map(b=>b.label),daySeries):'<div class="muted" style="font-size:11px;padding:14px 0">ちがう日にも解くと出ます</div>'}</div>
      </div></div>`;
  }).join('');
  const since=g.since?new Date(g.since):null;
  const dashSample=(m)=>`<svg width="22" height="6" style="vertical-align:middle"><line x1="0" x2="22" y1="3" y2="3" stroke="#5b6275" stroke-width="2"${MODE_DASH[m]?` stroke-dasharray="${MODE_DASH[m]}"`:''}/></svg>`;
  setView(histSeg()+`
    <div class="small" style="display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 4px">${GMODES.filter(([k])=>usedAll.has(k)).map(([k,t,c])=>`<span><b style="color:${c}">━</b>${anyMulti?dashSample(k):''} ${t}</span>`).join('')}</div>
    <p class="muted" style="font-size:11px;margin:0 0 8px">やった分は全部まとめて表示し、答え方ごとに線の色を分けています${anyMulti?'。教材が2つ以上ある科目は<b>教材ごとに色</b>を分け、答え方は<b>線の形</b>（実線＝自分で答える・点線＝4択 など）で分けています':''}（4択は自分で答えるより高めに出やすいので、同じ答え方どうしで比べてください）。数字は「いまの正答率」と、同じ問題での伸び（1回目→最近）です。理科・社会は、教材名から化学・生物などテストごとの科目に分けています。${since?` ${since.getMonth()+1}/${since.getDate()}から`:''}</p>
    ${names.length?rows:'<div class="card center small">まだ記録がありません。教材で問題を解くと、科目ごとの成長がここに出ます。</div>'}`);
}

// ------------------------------------------------------------ テスト日・今日のノルマ・直前チェック
function examCardHtml(){
  const st=S.examStatus;
  if(!st) return `<p style="margin:0 0 10px"><button class="btn sm ghost" onclick="openExamEditor()">🗓 テスト日を登録すると、毎日のノルマが出ます</button></p>`;
  const left=Math.max(0,st.quota-st.done_today), pct=st.quota?Math.min(100,Math.round(st.done_today/st.quota*100)):100;
  const nm=esc(st.exam.name)+(st.next_subject?`の <b>${esc(st.next_subject)}</b>`:'');
  const title=st.days_left===0?`今日は${nm}本番！がんばって💪`:`${nm}まで あと <b style="font-size:24px;color:var(--accent)">${st.days_left}</b> 日`;
  const md=d=>{const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}/${x.getDate()}(${'日月火水木金土'[x.getDay()]})`};
  // 科目ごと(理科は化学・生物など)の行: 日程・ノルマ・🎯直前チェック・🔍分析
  const multi=st.subjects&&st.subjects.length>1;
  const subjRows=multi?`<div style="margin:0 0 10px;border-top:1px dashed var(--line);padding-top:6px">${st.subjects.map(x=>{
      const past=x.days_left<0, lab=past?'おわり':x.days_left===0?'今日！':`あと${x.days_left}日`;
      const sb='class="btn sm ghost" style="padding:2px 7px;margin-left:4px"';
      return `<div class="row small" style="padding:3px 0"><span style="min-width:3.6em;${past?'opacity:.45':''}"><b>${esc(x.subject)}</b></span>${st.per_subject?`<span class="muted" style="min-width:4.8em;${past?'opacity:.45':''}">${md(x.date)}</span>`:''}<span class="grow" style="white-space:nowrap;${past?'opacity:.45':''}">${lab}${x.days_left>0&&x.quota?` <span class="muted">(${Math.min(x.done_today,x.quota)}/${x.quota}枚)</span>`:''}</span>${past?'':`<button ${sb} onclick="startPlan('final',${esc(JSON.stringify(x.deck_ids))},'直前チェック（${esc(x.subject)}）')">🎯</button>`}<button ${sb} onclick="openAnalysis({deck_ids:${esc(JSON.stringify(x.deck_ids))},label:${esc(JSON.stringify(x.subject))}})">🔍</button></div>`}).join('')}
      <div class="muted" style="font-size:10px;text-align:right">🎯 直前チェック　🔍 まちがえ方の分析（AI）</div></div>`:'';
  return `<div class="card" style="padding:12px 14px;border:2px solid #ffd9c7">
    <div class="row"><div class="grow">🗓 ${title}</div><button class="btn sm ghost" style="padding:3px 10px" onclick="openExamEditor(${st.exam.id})">編集</button></div>
    <div class="small muted" style="margin:2px 0 6px">範囲 ${st.deck_count}教材 ・ 覚えた ${st.mastered}/${st.total}枚</div>
    ${st.days_left>0?`<div class="row small"><b class="grow">今日のノルマ ${Math.min(st.done_today,st.quota)}/${st.quota}枚</b>${left?'':'<b style="color:var(--ok)">達成！🎉</b>'}</div>
      <div class="bar" style="height:10px;margin:4px 0 10px"><i style="width:${pct}%;background:${left?'var(--accent)':'var(--ok)'}"></i></div>`:''}
    ${subjRows}
    <div class="row">
      ${st.days_left>0&&st.remaining?`<button class="btn primary grow" onclick="startPlan('quota',${esc(JSON.stringify(st.deck_ids))},'今日のノルマ',${Math.max(left,10)},${st.exam.id})">▶ ${left?`今日の分をやる（${left}枚）`:'もっとやる'}</button>`:''}

const SUB_SUBJECTS={'理科':['物理','化学','生物','地学'],'社会':['地理','歴史','公民']};
function testSubject(d){const s=(d.subject||'').trim()||'その他';return (SUB_SUBJECTS[s]||[]).find(k=>(d.title||'').includes(k))||s}
function examSubjects(){

function drawExamSubjects(keep){
  const box=$('#exSubj'); if(!box) return;

    return `<div class="small" style="padding:3px 0"><b>${esc(k)}</b>${btn}</div>`+ds.map(d=>inp('deck:'+d.id,d.title,true)).join('');

function dayKey(d){d=new Date(d);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function renderHistory(){
  loading();
  if(S.histView==='test') return renderTestList();
  if(S.histView==='growth') return renderGrowth();
  let ss=[]; try{ ss=(await api('history',{profile_id:S.profile.id})).sessions }catch(e){ setView(`<div class="card">${esc(e.message)}</div>`); return }
  S.hist=ss;
  const byDay={}; ss.forEach(x=>{const k=dayKey(x.finished_at);(byDay[k]=byDay[k]||{n:0,ok:0,list:[]});byDay[k].n+=x.total;byDay[k].ok+=x.correct;byDay[k].list.push(x)});
  // 連続で勉強した日数
  let streak=0; const t=new Date(); for(let k=0;k<400;k++){const d=new Date(t);d.setDate(t.getDate()-k);if(byDay[dayKey(d)])streak++;else if(k>0)break}
  const week=Object.entries(byDay).filter(([k])=>daysAgo(k+'T00:00:00')<7).reduce((s,[,v])=>s+v.n,0);
  const tot=ss.reduce((s,x)=>s+x.total,0), okAll=ss.reduce((s,x)=>s+x.correct,0);
  const days=[...Array(14)].map((_,k)=>{const d=new Date(t);d.setDate(t.getDate()-13+k);const v=byDay[dayKey(d)];return {d,n:v?v.n:0,ok:v?v.ok:0}});
  const mx=Math.max(10,...days.map(x=>x.n));
  setView(histSeg()+`
    <div class="stats">
      <div class="stat"><b>${streak}</b><span>連続日数</span></div>
      <div class="stat"><b>${week}</b><span>この7日で解いた数</span></div>
      <div class="stat"><b>${tot?Math.round(okAll/tot*100):0}%</b><span>全体の正解率</span></div>
    </div>
    <div class="card"><h3>この2週間</h3>
      <div style="display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:6px">
        ${days.map(x=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${x.n}問">
          <div style="height:${(x.n-x.ok)/mx*100}%;background:var(--ng);border-radius:${x.n-x.ok?'4px 4px 0 0':'0'}"></div>
          <div style="height:${x.ok/mx*100}%;background:var(--ok);border-radius:${x.n-x.ok?'0':'4px 4px 0 0'}"></div></div>`).join('')}
      </div>
      <div style="display:flex;gap:4px;margin-top:4px">${days.map(x=>`<div class="muted" style="flex:1;text-align:center;font-size:10px">${x.d.getDate()}</div>`).join('')}</div>
      <p class="muted small" style="margin:6px 0 0">緑＝正解、赤＝まちがい（解いた問題数）</p>
    </div>
    ${ss.length?Object.entries(byDay).map(([k,v])=>`<div class="card">
      <div class="row"><h3 class="grow" style="margin:0">${k.replace(/^(\d+)-0?(\d+)-0?(\d+)$/,'$2月$3日')}</h3><span class="muted small">${v.n}問 ・ 正解 ${v.ok}</span></div>
      <ul class="qlist">${v.list.map(x=>{const pct=x.total?Math.round(x.correct/x.total*100):0;const d=new Date(x.finished_at);return `<li><div class="grow">
        <div class="row"><b class="grow">${esc(x.deck_title||'教材')}</b><span class="chip ${pct>=80?'ok':pct<50?'rev':''}">${x.correct}/${x.total}（${pct}%）</span></div>
        <div class="muted small">${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ・ ${x.mode==='review'?'🔁 復習':'▶ 学習'}${x.subject?(ts=>` ・ <button class="subj-link" onclick="openSubjectGrowth(${esc(JSON.stringify(ts))})">📊 ${esc(ts)} ›</button>`)(testSubject({subject:x.subject,title:x.deck_title})):''}
          ${x.answer_mode==='choice'?' ・ 4択':x.answer_mode==='flip'?' ・ 自分で答えた':''}</div>
        ${x.deck_id&&x.mode!=='review'?(x.answer_mode==='mixed'
          ?`<div class="row small" style="gap:6px;margin-top:4px"><span class="muted">答え方は？</span><button class="btn sm ghost" style="padding:3px 10px" onclick="setSessionMode(${x.id},'choice')">4択だった</button><button class="btn sm ghost" style="padding:3px 10px" onclick="setSessionMode(${x.id},'flip')">自分で答えた</button></div>`
          :`<button class="btn sm ghost" style="padding:1px 8px;font-size:11px;margin-top:2px" onclick="setSessionMode(${x.id},'${x.answer_mode==='choice'?'flip':'choice'}')">答え方を「${x.answer_mode==='choice'?'自分で答えた':'4択'}」に直す</button>`):''}
        ${(x.wrong_items||[]).length?`<details class="small" style="margin-top:4px"><summary>まちがえた問題（${x.wrong_items.length}）</summary>
          ${x.wrong_items.map(w=>`<div style="margin:4px 0">・${esc(w.q)} → <b>${esc(w.a)}</b></div>`).join('')}</details>`:''}
      </div></li>`}).join('')}</ul></div>`).join('')
    :'<div class="card center"><p>まだ記録がありません。<br>教材を開いて「はじめる」を押すと、ここに記録されます。</p></div>'}`);
}

function loadImage(src){return new Promise((ok,ng)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ng(new Error('画像を読み込めませんでした'));im.src=src})}
async function fileToJpeg(file,maxSide=1600,q=0.82){
  const url=URL.createObjectURL(file);
  try{const im=await loadImage(url);return drawToJpeg(im,im.naturalWidth,im.naturalHeight,maxSide,q)}finally{URL.revokeObjectURL(url)}
}
function drawToJpeg(src,w,h,maxSide,q){
  const s=Math.min(1,maxSide/Math.max(w,h)); const c=document.createElement('canvas');
  c.width=Math.round(w*s);c.height=Math.round(h*s);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
let pdfjsReady=null;
function loadPdfJs(){
  if(pdfjsReady) return pdfjsReady;
  pdfjsReady=new Promise((ok,ng)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok(window.pdfjsLib)};
    s.onerror=()=>{pdfjsReady=null;ng(new Error('PDFを読む部品を読み込めませんでした'))};document.head.appendChild(s)});
  return pdfjsReady;
}
async function pdfToJpegs(file,onPage){
  const lib=await loadPdfJs(); const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const vp0=page.getViewport({scale:1}); const scale=Math.min(3,1800/Math.max(vp0.width,vp0.height));
    const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    out.push(drawToJpeg(c,c.width,c.height,1600,0.82)); onPage&&onPage(p,pdf.numPages);
  }
  return out;
}

function jobGenExpect(j){const so=j.model==='sonnet';return Math.round((so?25:40)+(j.nReq||Math.max(30,(j.pageCount||5)*6))*(so?0.7:1.1))}
function jobPct(j){
  let pct=0;
  if(j.kind==='test'){
    const genExp=j.genExpect||60, genT=j.step==='gen'?Math.min(0.95,(j.sec-(j.genStart||0))/genExp):0;
    pct=j.step==='done'?100:10+85*genT;
  }else if(j.step==='prep') pct=5*(j.prepFrac||0);
  else if(j.step==='upload') pct=5+5*(j.upFrac||0);
  else if(j.step==='reading') pct=10+50*((j.readDone||0)/(j.pageCount||1));
  else if(j.step==='generating'){const t=j.genStartedAt?(Date.now()-j.genStartedAt)/1000:0;pct=(j.pageCount?60:10)+(j.pageCount?35:85)*Math.min(0.95,t/jobGenExpect(j))}
  else if(j.step==='done') pct=100;
  pct=Math.max(j.lastPct||0,Math.round(pct)); j.lastPct=pct; return pct;
}
function jobStatusText(j){
  if(j.step==='done') return j.kind==='test'?`✅ ${j.cardCount}問のテストができました`:`✅ ${j.cardCount}枚できました`;
  if(j.step==='error') return `⚠️ ${j.error}`;
  if(j.kind==='test'){const left=Math.round((j.genExpect||60)-(j.sec-(j.genStart||0)));return `AIがテスト問題を考え中（${j.modelLabel}）・${left>5?'あと約'+left+'秒':'もう少し'}`}
  if(j.step==='prep') return '写真・PDFを準備中…（終わるまでアプリを閉じないでね）';
  if(j.step==='upload') return `写真をサーバーに送信中 ${j.upDone||0}/${j.pageCount||0}（もうすぐ閉じても大丈夫）`;
  if(j.step==='reading') return `教材を読み取り中（${j.readDone||0}/${j.pageCount||0}ページ）・アプリを閉じても続きます`;
  if(j.step==='generating'){const t=j.genStartedAt?(Date.now()-j.genStartedAt)/1000:0, left=Math.round(jobGenExpect(j)-t);
    return `AIが${j.nReq?'約'+j.nReq+'枚の':''}カードを考え中（${j.modelLabel}）・${left>5?'あと約'+left+'秒':'もう少し'}・閉じても大丈夫`}
  return '';
}
function jobCardHtml(j){
  const pct=jobPct(j), sec=j.createdAt?Math.max(0,Math.round(((j.endAt||Date.now())-j.createdAt)/1000)):j.sec, mm=Math.floor(sec/60), ss=sec%60;
  return `<div class="card" style="margin-bottom:10px">
    <div class="row"><b class="grow">${esc(j.label)}</b><span class="muted small">${esc(j.profileName)} ・ ${mm?mm+'分':''}${ss}秒</span></div>
    <div class="row" style="margin-top:6px"><div class="bar grow" style="height:10px;margin:0"><i style="width:${pct}%;background:${j.step==='error'?'var(--ng)':j.step==='done'?'var(--ok)':'var(--accent)'}"></i></div><b style="width:44px;text-align:right">${pct}%</b></div>
    <div class="small" style="margin-top:6px">${esc(jobStatusText(j))}</div>
    ${j.step==='done'?`<div class="row" style="margin-top:8px"><button class="btn primary sm" onclick="openJobDeck(${j.id})">${j.kind==='test'?'テストを受ける':'問題の一覧を見る'}</button><button class="btn sm ghost" onclick="dismissJob(${j.id})">閉じる</button></div>`:''}
    ${j.step==='error'?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="retryJob(${j.id})">入力にもどす</button><button class="btn sm ghost" onclick="dismissJob(${j.id})">閉じる</button></div>`:''}
  </div>`;
}
function drawJobs(){
  // ヘッダーの下の小さなバー (どの画面でも見える)

async function uploadJob(j){
  const m=j.form;
  try{
    const params={profile_id:j.profileId,label:j.label,style:m.style,grade:m.grade,term:m.term,subject:m.subject,title:(m.title||'').trim(),
      count:j.nReq?Math.max(5,Math.min(150,j.nReq)):'auto',include_written:!!m.written,include_related:!!m.related,instructions:m.order||'',model:m.model||'opus'};
    if(m.useText){
      const r=await api('job_create',{...params,source_text:m.text,page_count:0});
      j.serverId=r.job_id; j.step='generating'; j.genStartedAt=Date.now();
    }else{
      // 1) 写真・PDFを画像にそろえる (ここだけはスマホで行う)
      const pages=[];
      for(const f of m.files){
        const fi=m.files.indexOf(f), nf=m.files.length;
        if(f.kind==='pdf'){ pages.push(...await pdfToJpegs(f.file,(p,n)=>{j.prepFrac=(fi+p/n)/nf})) }
        else { pages.push(await fileToJpeg(f.file)); j.prepFrac=(fi+1)/nf }
      }
      // 2) サーバーに預ける (約3MBずつ)
      j.step='upload'; j.pageCount=pages.length; j.upDone=0;
      const r=await api('job_create',{...params,page_count:pages.length}); j.serverId=r.job_id;
      let k=0;
      while(k<pages.length){
        const chunk=[]; let size=0;
        while(k+chunk.length<pages.length&&(chunk.length===0||size+pages[k+chunk.length].length<3.2e6)&&chunk.length<4){size+=pages[k+chunk.length].length;chunk.push(pages[k+chunk.length])}
        await api('job_pages',{job_id:j.serverId,start:k,pages:chunk}); k+=chunk.length; j.upDone=k; j.upFrac=k/pages.length;
      }
      j.step='reading'; j.readDone=0;
    }
    // 3) あとはサーバーが自分で進める (この返事は待たなくてよい)
    api('job_start',{job_id:j.serverId}).then(syncJobs).catch(()=>{});
    setTimeout(syncJobs,3000);
  }catch(e){ j.step='error'; j.error=e.message; }
  if(!S.jobs.some(x=>['prep','upload'].includes(x.step))) keepAwake(false);
  drawJobs();
}
// サーバーにある作成ジョブの状態を取りに行く (開き直したときや別のスマホでも見える)
const STEP_OF={uploading:'upload',queued:'reading',reading:'reading',generating:'generating',done:'done',error:'error'};
let syncing=false, lastKick={};
async function syncJobs(){
  if(syncing||!S.pass) return; syncing=true;
  try{
    const r=await api('job_list',{}); const now=new Date(r.now).getTime();
    for(const sj of r.jobs){
      let j=S.jobs.find(x=>x.serverId===sj.id);
      if(!j){
        if(sj.status==='uploading'&&now-new Date(sj.updated_at||sj.created_at).getTime()<10*60e3) continue; // 別の画面で送信中
        j={id:++jobSeq,kind:'make',serverId:sj.id,label:sj.label,profileId:sj.profile_id,profileName:(S.profiles.find(p=>p.id===sj.profile_id)||{}).name||'',
          sec:0,createdAt:new Date(sj.created_at).getTime(),model:(sj.params||{}).model,modelLabel:(sj.params||{}).model==='sonnet'?'Sonnet':'Opus',
          nReq:parseInt((sj.params||{}).count,10)||0};
        S.jobs.unshift(j);
      }
      if(['prep','upload'].includes(j.step)&&sj.status==='uploading') continue; // まだこのスマホから送信中
      j.step=STEP_OF[sj.status]||j.step; j.label=sj.label||j.label; j.pageCount=sj.page_count; j.readDone=sj.read_done;
      j.genStartedAt=sj.gen_started_at?new Date(sj.gen_started_at).getTime():null; j.deckId=sj.deck_id; j.cardCount=sj.card_count; j.error=sj.error;
      if(sj.status==='uploading'){j.step='error';j.error='写真を送る途中でアプリが閉じられたため、止まりました。もう一度作ってください。'}
      if(['done','error'].includes(j.step)&&!j.endAt) j.endAt=new Date(sj.updated_at||sj.created_at).getTime();
      if(j.step==='done'&&!j.notified&&j.seenActive){j.notified=true;toast(`✅「${j.label}」${j.cardCount}枚できました！`,4000);if(S.tab==='decks'&&S.profile&&S.profile.id===j.profileId&&!S.deck)renderDecks()}
      if(!['done','error'].includes(j.step)) j.seenActive=true;
      // 止まっていそうなら、サーバーに続きを頼む
      const hb=sj.heartbeat_at?new Date(sj.heartbeat_at).getTime():new Date(sj.created_at).getTime();
      if(['queued','reading','generating'].includes(sj.status)&&now-hb>150e3&&Date.now()-(lastKick[sj.id]||0)>120e3){
        lastKick[sj.id]=Date.now(); api('job_continue',{job_id:sj.id}).catch(()=>{});
      }
    }
  }catch(e){}
  syncing=false; drawJobs();
}
setInterval(()=>{if(S.jobs.some(j=>j.serverId&&!['done','error'].includes(j.step)))syncJobs()},5000);

async function saveProfile(id){
  try{ await api('update_profile',{profile_id:id,name:$('#pn'+id).value});
    const r=await api('overview'); S.profiles=r.profiles; const me=S.profiles.find(p=>p.id===S.profile.id); if(me){S.profile=me;$('#hWho').innerHTML=`${avatarHtml(me,22)} ${esc(me.name)} ▾`}
    toast('保存しました') }catch(e){toast(e.message)}
}
async function addProfile(){
  try{ await api('add_profile',{name:$('#newN').value,emoji:$('#newE').value,sort:S.profiles.length+1}); const r=await api('overview'); S.profiles=r.profiles; renderSettings(); toast('追加しました') }catch(e){toast(e.message)}
}
async function changePass(){
  const v=$('#np').value; if(v.length<6) return toast('6文字以上にしてください');
  try{ await api('change_pass',{new_pass:v}); S.pass=v; lsSet('flash_pass',v); $('#np').value=''; toast('変更しました') }catch(e){toast(e.message)}
}

// ---- 新しい版が公開されたら自動で切り替える (古い画面のまま使い続けないように)
let pageHash=null, updateReady=false;
async function fetchPageHash(){
  try{ const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); if(!r.ok) return null;
    const t=await r.text(); let h=0; for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0} return h }catch(e){ return null }
}
function busy(){return !!(ST||S.taking||(S.jobs||[]).some(j=>!['done','error'].includes(j.step))||$('#modalRoot').innerHTML)}
async function checkUpdate(){
  const h=await fetchPageHash(); if(h==null) return;
  if(pageHash==null){pageHash=h;return}
  if(h!==pageHash){
    updateReady=true;
    if(!busy()) return location.reload();
    const b=$('#updBar'); b.classList.remove('hidden');
  }
}
function doUpdate(){ if(ST) keepPending(); location.reload() }
setInterval(checkUpdate,120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setTimeout(checkUpdate,3000);

// 前回の人で開き直す
(async()=>{
  const pid=+lsGet('flash_profile');
  await boot();
  sendLeftoverSession();
  syncJobs();
  if(pid&&S.profiles.length&&S.profiles.find(p=>p.id===pid)) enterProfile(pid);
})();
</script>
